<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Report</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Login gate ── */
    #gate {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 44px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,.5);
    }
    #gate .logo {
      font-size: 36px;
      margin-bottom: 10px;
    }
    #gate h1 {
      color: #f8fafc;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    #gate .subtitle {
      color: #64748b;
      font-size: 12px;
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    #gate input {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 15px;
      letter-spacing: 0.15em;
      outline: none;
      transition: border-color .2s;
    }
    #gate input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    #gate input::placeholder { letter-spacing: 0.04em; color: #475569; }
    #gate button {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    #gate button:hover  { background: #1d4ed8; }
    #gate button:active { transform: scale(0.98); }
    #error {
      margin-top: 12px;
      color: #f87171;
      font-size: 13px;
      min-height: 20px;
      font-weight: 500;
    }
    #gate .hint {
      margin-top: 20px;
      color: #334155;
      font-size: 11px;
    }

    /* ── Spinner shown while report loads ── */
    #loading {
      display: none;
      position: fixed;
      inset: 0;
      background: #0f172a;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      color: #94a3b8;
      font-size: 14px;
    }
    #loading.show { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Report frame ── */
    #report {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Password gate -->
  <div id="gate">
    <div class="logo">📈</div>
    <h1>Daily Stock Report</h1>
    <p class="subtitle">Private &nbsp;·&nbsp; Restricted Access &nbsp;·&nbsp; 2026-08-28</p>
    <p style="font-size:10px;color:#475569;margin-top:-18px;margin-bottom:22px;">Password changes daily at midnight UTC</p>
    <input id="pw" type="password" placeholder="Enter password"
           autofocus autocomplete="current-password"
           onkeydown="if(event.key==='Enter') unlock()">
    <button onclick="unlock()">Unlock Report</button>
    <div id="error"></div>
    <p class="hint">Access is restricted. Contact the owner to request credentials.</p>
  </div>

  <!-- Loading overlay -->
  <div id="loading">
    <div class="spinner"></div>
    <span>Loading report…</span>
  </div>

  <!-- Report iframe -->
  <iframe id="report" title="Stock Report"></iframe>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // Two hashes are checked — entering EITHER password unlocks the report:
    //
    //   REPORT_HASH  — SHA-256 of today's rotating daily password.
    //                  Changes every calendar day at midnight UTC.
    //                  You receive it in the nightly email.
    //
    //   MASTER_HASH  — SHA-256 of PAGES_PASSWORD (your permanent master word).
    //                  Never rotates. Always works as a backdoor.
    //                  Update PAGES_PASSWORD secret → re-run workflow → done.
    //
    // Both values are injected automatically by the CI workflow.
    // Raw passwords are NEVER stored here — only their SHA-256 hashes.
    // ─────────────────────────────────────────────────────────────────────────
    const REPORT_HASH = "f3d1f278b9d1ba70fa5c036f1e45af8c2979f2b43327ba0e46774ca039fa8e85";   // today's daily password hash  — replaced by CI
    const MASTER_HASH = "1716bed4afb07b54967a8de8a67c885321dedf98ba66b11051ccbeeb54999a59";   // permanent master word hash   — replaced by CI

    const SESSION_KEY = "sr_auth_v1";

    async function sha256(str) {
      const buf = await crypto.subtle.digest(
        "SHA-256", new TextEncoder().encode(str)
      );
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function unlock() {
      const pw = document.getElementById("pw").value.trim();
      if (!pw) return;

      const hash = await sha256(pw);

      // Accept today's rotating password OR the permanent master word
      if (hash === REPORT_HASH || hash === MASTER_HASH) {
        // Store in sessionStorage — auth lasts for this browser tab only
        sessionStorage.setItem(SESSION_KEY, "1");
        showReport();
      } else {
        const err = document.getElementById("error");
        err.textContent = "Incorrect password.";
        document.getElementById("pw").value = "";
        document.getElementById("pw").focus();
        // Brief shake animation on the gate
        document.getElementById("gate").animate(
          [{transform:"translateX(-6px)"},{transform:"translateX(6px)"},
           {transform:"translateX(-4px)"},{transform:"translateX(4px)"},
           {transform:"translateX(0)"}],
          {duration: 300}
        );
      }
    }

    function showReport() {
      document.getElementById("gate").style.display    = "none";
      document.getElementById("loading").classList.add("show");
      document.body.style.background = "#fff";

      const frame = document.getElementById("report");
      frame.onload = () => {
        document.getElementById("loading").classList.remove("show");
        frame.style.display = "block";
      };
      frame.src = "report.html";
    }

    // Auto-unlock if already authenticated in this session
    if (sessionStorage.getItem(SESSION_KEY) === "1") {
      showReport();
    }
  </script>
</body>
</html>
