<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticker — Signal Explorer</title>
<link rel="stylesheet" href="styles.css">
<script src="data.js"></script>
<script src="app.js"></script>
</head><body>
<header class="top"><div class="row"><div class="brand">Signal<span>Explorer</span></div><nav><a href="home.html">Home</a><a href="stocks.html">Stocks</a><a href="etfs.html">ETFs</a><a href="crypto.html">Crypto</a><a href="macro.html">Macro</a><a href="screener.html">Screener</a><a href="compare.html">Compare</a><a href="about.html">About</a></nav></div></header>
<div class="wrap">
<div id="root"><p class="muted">Loading…</p></div>
<script>
const D=window.SITE_DATA;
const p=new URLSearchParams(location.search);
const a=p.get("a")||"stock", t=p.get("t")||"";
function find(){
  if(a==="stock")return D.stocks.find(x=>x.ticker===t);
  const arr=a==="etf"?D.etfs:D.crypto;return (arr||[]).find(x=>x.ticker===t);
}
const r=find();const root=$("#root");
if(!r){root.innerHTML=`<h1>${t}</h1><p class="callout bad">Not found in this dataset.</p>
 <p><a href="screener.html">← back to screener</a></p>`;}
else if(a==="stock"){
  const id="stock:"+r.ticker;
  const lay=r.layer||{};
  const layRows=[["L1 Technical",lay.l1_tech],["L2 Graph",lay.l2_graph],["L3 News",lay.l3_news],
    ["L4 Fundamentals",lay.l4_fa],["Macro",lay.macro]];
  root.innerHTML=`
   <div class="controls"><a href="stocks.html">← Stocks</a></div>
   <h1>${r.ticker} <span class="star ${wlHas(id)?'on':''}" id="st">★</span></h1>
   <p class="sub">${r.sector} · last signal ${r.last_date} · ${r.n_signals} logged signals</p>
   <div class="grid cols-4" style="margin:14px 0">
     <div class="kpi"><div class="label">InvScore</div><div class="val ${invClass(r.inv_score)}">${r.inv_score??"—"}</div><div class="note">${r.label}</div></div>
     <div class="kpi"><div class="label">Signal score</div><div class="val">${r.signal_score}</div></div>
     <div class="kpi"><div class="label">Own hit rate 20d</div><div class="val warn">${pctRaw(r.hit_rate_20d)}</div></div>
     <div class="kpi"><div class="label">Avg 20d return</div><div class="val ${r.avg_return_20d_pct>0?'good':'bad'}">${pct(r.avg_return_20d_pct)}</div></div>
   </div>
   <div class="callout warn"><b>Descriptive, not a buy call.</b> A high InvScore historically maps to
     <em>worse</em> forward returns (inverse calibration). See <a href="about.html">methodology</a>.</div>
   <h2>Per-layer sub-scores</h2>
   <div class="card tight"><table><thead><tr><th>Layer</th><th class="num">Score</th><th style="width:50%"></th></tr></thead>
   <tbody>${layRows.map(([n,v])=>`<tr><td>${n}</td><td class="num">${v==null?"—":v.toFixed(0)}</td>
     <td><div class="bar"><span style="left:0;width:${v==null?0:Math.min(100,v)}%;background:var(--accent)"></span></div></td></tr>`).join("")}</tbody></table></div>`;
  $("#st").onclick=e=>{const on=wlToggle(id);e.currentTarget.classList.toggle("on",on);};
}else{
  const id=a+":"+r.ticker;const m=r.metrics;
  const mk=(l,v,c,s="")=>`<div class="kpi"><div class="label">${l}</div><div class="val ${c||''}">${v}</div><div class="note">${s}</div></div>`;
  root.innerHTML=`
   <div class="controls"><a href="${a}s.html">← ${a==='etf'?'ETFs':'Crypto'}</a></div>
   <h1>${r.ticker.replace('-USD','')} <span class="star ${wlHas(id)?'on':''}" id="st">★</span>
     <span class="tag">price-based</span></h1>
   <p class="sub">${r.name} · ${r.sector||a} · ${r.n_obs} daily obs</p>
   <div class="grid cols-4" style="margin:14px 0">
     ${mk("Last",m.last!=null?("$"+m.last):"—")}
     ${mk("12-1 momentum",pct(m.mom_12_1),m.mom_12_1>0?'good':'bad')}
     ${mk("Trend vs 200d",pct(m.trend_200d),m.trend_200d>0?'good':'bad',m.above_200d?'above MA':'below MA')}
     ${mk("3-month",pct(m.ret_3m),m.ret_3m>0?'good':'bad')}
     ${mk("12-month",pct(m.ret_12m),m.ret_12m>0?'good':'bad')}
     ${mk("Max drawdown",pct(m.max_drawdown),'bad')}
     ${mk("Annual vol",num(m.vol_annual,1,'%'),'warn')}
     ${mk("Naive Sharpe",num(m.sharpe_naive,2),m.sharpe_naive>0?'good':'bad')}
   </div>
   <div class="callout ${a==='crypto'?'exp':''}">${a==='crypto'?'<b>Experimental:</b> ':''}Price-based metrics
     only — not the equity InvScore. <a href="about.html">methodology</a>.</div>`;
  $("#st").onclick=e=>{const on=wlToggle(id);e.currentTarget.classList.toggle("on",on);};
}
</script></div>
<div class="wrap"><footer>
Static, self-contained, no server. All numbers from a real pipeline run.
Stocks use the equity InvScore; ETFs &amp; crypto use transparent price-based metrics
(<a href="about.html">methodology</a>). Descriptive only — not investment advice.
</footer></div>
</body></html>
